<style>
  html,body{margin:0;height:100%;background:#020203;color:#cfd8de;font-family:ui-sans-serif,system-ui,sans-serif;overflow:hidden}
  canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  /* the loader (Figma 15371:17727) — js/loader.js runs it; main.js adds .hide when the site is warm */
  @font-face{font-family:'PP Supply Mono';src:url(assets/fonts/PPSupplyMono-Regular.woff) format('woff');font-display:swap}
  @property --mza{syntax:'<angle>';inherits:false;initial-value:0deg}
  #loader{position:fixed;inset:0;z-index:15;background:#030302;overflow:hidden;--s:1;cursor:default}
  #loader.live{background:transparent}
  #loader.live #ldr-lines{display:none}
  #loader.out{pointer-events:none}
  #loader.fadeout{transition:opacity 1.2s ease;opacity:0}
  #ldr-lines,#ldr-gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ldr-lines circle{fill:none;stroke:#daceb0;stroke-opacity:.09;stroke-width:.5}
  .ldr-t{position:absolute;left:50%;transform:translateX(-50%);font-family:'PP Supply Mono',ui-monospace,monospace;font-size:calc(10px*var(--s));text-transform:uppercase;text-align:center;transition:opacity .45s ease}
  #loader.out .ldr-t{opacity:0}
  .ldr-sub{top:calc(50% + 135px*var(--s));width:calc(264px*var(--s));line-height:1.7;color:#daceb0;opacity:.6;animation:ldrin .6s .9s both}
  .ldr-bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(218,206,176,.12)}
  .ldr-bar i{position:absolute;inset:0;background:#daceb0;transform:scaleX(0);transform-origin:0 50%;will-change:transform}
  #loader.out .ldr-bar{opacity:0;transition:opacity .45s ease}
  .ldr-n{bottom:calc(20px*var(--s));line-height:1.7;color:#daceb0;opacity:.6}
  .ldr-snd{top:calc(50% + 268px*var(--s));display:flex;gap:calc(12px*var(--k));align-items:center;visibility:hidden}
  /* the sound buttons only come once the site is loaded (main.js adds .hide → loader.js adds .ready) */
  #loader.ready .ldr-snd{visibility:visible}
  .ldr-snd .ldr-b{opacity:0}
  #loader.ready .ldr-snd .ldr-b{animation:ldrb .5s cubic-bezier(.2,.7,.2,1) both}
  #loader.ready .ldr-snd .ldr-b+.ldr-b{animation-delay:.12s}
  @keyframes ldrb{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes ldrin{from{opacity:0;transform:translate(-50%,6px)}}
  /* the sound buttons = the site's .mz-btn / .mz-key (js/modules.js), copied so they look right before it loads */
  :root{--k:1}
  .ldr-b{display:flex;align-items:center;gap:calc(8px*var(--k));background:#0b0a08;border:0;margin:0;padding:calc(6px*var(--k)) calc(9px*var(--k)) calc(6px*var(--k)) calc(7px*var(--k));cursor:pointer;user-select:none;font-family:'PP Supply Mono',ui-monospace,monospace;font-size:calc(10px*var(--k));letter-spacing:.02em;text-transform:uppercase;color:#f1e8d0;line-height:1.25}
  .ldr-b:hover,.ldr-b.sel{background:#1a1813}
  .ldr-key{position:relative;display:inline-grid;place-items:center;width:calc(24px*var(--k));height:calc(15px*var(--k));padding:0;box-sizing:border-box;flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 14%,transparent)}
  .ldr-key b{font-weight:400;font-size:calc(9px*var(--k));line-height:1}
  .ldr-key i{position:absolute;inset:0;padding:1px;background:conic-gradient(from var(--mza),transparent 0 50%,color-mix(in srgb,currentColor 25%,transparent) 72%,currentColor 99%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:mzrun 1.8s linear infinite}
  @keyframes mzrun{to{--mza:360deg}}
  #loader.ready:not(.out) .ldr-key i{animation-duration:.8s}   /* ready: the keys run faster — waiting for the sound choice */
  /* the phone page (js/mobile.js, Figma 15434:1150) */
  #mob{position:fixed;inset:0;background:#cdc4a9;overflow:hidden}
  #mob-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
  #mob-t{position:absolute;inset:0;width:100%;height:100%;display:block}
  #mob-bar{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:5px;padding:3px 6px 3px 3px;background:#0a0908;border:1px solid #0a0908}
  #mob-bar .mob-ico{flex:none;width:32px;height:32px;box-sizing:border-box;border:1px solid #ccc3a9;overflow:hidden;background:#fdf4df}
  #mob-bar .mob-ico img{display:block;width:100%;height:100%;object-fit:cover}
  #mob-bar .mob-tx{display:flex;flex-direction:column;gap:5px;font:400 10px/1 'PP Supply Mono',ui-monospace,monospace;text-transform:uppercase;color:#fdf4df;white-space:nowrap;min-width:0}
  #mob-bar .mob-tx span{overflow:hidden;text-overflow:ellipsis}
  #mob-bar .mob-dim{opacity:.6}

<script>/* page dissolve: show the previous page's last frame from the first paint (js/pagefx.js burns it away) */try{var s=sessionStorage.getItem('pagefx-snap');if(s){sessionStorage.removeItem('pagefx-snap');var o=JSON.parse(s);if(Date.now()-o.t<20000){var d=document.createElement('div');d.id='pagefx';d.dataset.src=o.src;d.style.cssText='position:fixed;inset:0;z-index:2147483000;pointer-events:none;background:#070605 url('+o.src+') center/100% 100% no-repeat';document.body.appendChild(d);}}}catch(e){}</script>
<canvas id="gl"></canvas>
<div id="loader">
  <svg id="ldr-lines" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><circle cx="540" cy="540" r="539.75"/><circle cx="1380" cy="540" r="539.75"/><circle cx="960" cy="540" r="539.75"/><circle cx="960" cy="960" r="539.75"/><circle cx="960" cy="120" r="539.75"/><circle cx="1257" cy="837" r="539.75"/><circle cx="663" cy="243" r="539.75"/><circle cx="663" cy="837" r="539.75"/><circle cx="1257" cy="243" r="539.75"/></svg>
  <canvas id="ldr-gl"></canvas>
  <div class="ldr-t ldr-sub">close your eyes slowly. the dream is still loading, don't wake up yet.</div>
  <div class="ldr-t ldr-snd"><button class="ldr-b" data-snd="on"><span class="ldr-key"><i></i><b>ON</b></span><span>SOUND ON</span></button><button class="ldr-b" data-snd="off"><span class="ldr-key"><i></i><b>OFF</b></span><span>SOUND OFF</span></button></div>
  <div class="ldr-t ldr-n" data-n>0</div>
  <div class="ldr-bar"><i></i></div>
</div>
<script>window.__loaderHold = true;
/* phones get the phone page (js/mobile.js): the experience is built for desktop */
window.__mobile = /[?&]mobile\b/.test(location.search) || (!/[?&]desktop\b/.test(location.search) && matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 700);
if (window.__mobile) document.getElementById('loader').style.display = 'none';
/* coming back from another page of the site (#pagefx holds its last frame): no loader — that frame covers the home page while it warms up, then burns away into it */
window.__skipLoader = !!document.getElementById('pagefx'); if (window.__skipLoader) document.getElementById('loader').style.display = 'none';</script>
<script>(function(){var f=function(){var l=document.getElementById('loader');if(l)l.style.setProperty('--s',Math.max(.75,innerWidth/1920));document.documentElement.style.setProperty('--k',Math.max(.8,Math.min(1.6,innerWidth/1440)).toFixed(3))};f();addEventListener('resize',f)})()</script>

<script type="module">
  // the site itself starts once the loader's title has stuck (loader.js calls __startMain), so its warm-up never makes the stickers stutter
  let mainGo = false;
  window.__startMain = () => { if (mainGo) return; mainGo = true; import('./js/main.js?v=' + Date.now()).catch((e) => {
    document.getElementById('err').textContent = 'module failed to load:\n' + (e && (e.stack || e.message) || e);
  }); };
  const l = document.getElementById('loader');
  if (window.__mobile) {
    l.remove(); document.getElementById('pagefx')?.remove();
    import('./js/mobile.js').catch((e) => { document.getElementById('err').textContent = 'module failed to load:\n' + (e && (e.stack || e.message) || e); });
  } else if (window.__skipLoader) {
    // no loader: the old frame smoulders while the site warms up, and burns away the moment it's ready (main.js adds
    // .hide); the intro + title start under the burn. Sound as it was chosen before (this tab), else off.
    const ready = new Promise((r) => { const ok = () => { if (l.classList.contains('hide')) { window.__loaderHold = false; l.remove(); r(); return true; } }; if (!ok()) new MutationObserver(ok).observe(l, { attributes: true }); });
    for (const ev of ['wheel', 'touchmove', 'keydown']) addEventListener(ev, (e) => { if (window.__loaderHold) { e.stopImmediatePropagation(); if (ev !== 'keydown' && e.cancelable) e.preventDefault(); } }, { capture: true, passive: false });
    import('./js/sound.js').then((m) => { let on = false; try { on = sessionStorage.getItem('crow-snd') === '1'; } catch (e) {} m.SND.muted = !on; if (on) m.soundEnable(); });
    import('./js/pagefx.js').then((m) => m.arrive(ready, 40000));
    window.__startMain();
  } else {
    setTimeout(window.__startMain, 5000);   // safety
    import('./js/loader.js').catch((e) => { console.warn('loader', e); window.__startMain(); new MutationObserver(() => { if (l.classList.contains('hide')) { window.__loaderHold = false; l.classList.add('fadeout'); setTimeout(() => l.remove(), 1300); } }).observe(l, { attributes: true }); });   // safety: never leave the site covered
  }
</script>
